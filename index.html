<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mochila de Jogo</title>
<meta name="description" content="Agenda de jogos, checklist da mochila e custos de viagem para jogadores de airsoft.">
<meta name="theme-color" content="#09090a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mochila">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: coluna estreita tipo prancheta; agenda de jogos -> ficha do jogo (checklist, custos, detalhes); barra inferior fixa */
:root{
  /* black piano: preto profundo, cartões grafite, acentos oliva e âmbar (tema único) */
  --bg:#09090a; --card:#151517; --fg:#ecebe6; --muted:#9b9a93; --line:#2a2a2e;
  --accent:#a9bd5f; --accent-fg:#0b0c08; --tag:#e3a24c; --done:#5f5f5a; --soft:#202024;
  --display:"Saira Stencil One","Impact",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg) linear-gradient(170deg,#1a1a1d 0%,#09090a 38%,#050506 100%) fixed;color:var(--fg);font-family:var(--body);font-size:16px;min-height:100%}
.box,.trip,.cat,.qa,.tool,.totals div,.sum,.result,.links a{background-image:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.02em;line-height:1.05;text-wrap:balance}
h2.sec{font-family:var(--cond);font-weight:700;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.lead{color:var(--muted);margin:8px 0 0;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--cond);font-weight:600;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:3px}
.chip[aria-pressed="true"],.chip.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip.danger{background:var(--tag);border-color:var(--tag);color:var(--accent-fg)}
.pill{font-family:var(--cond);font-weight:600;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:var(--soft);color:var(--fg);white-space:nowrap}
.pill.go{background:var(--accent);color:var(--accent-fg)}
.pill.warn{background:none;color:var(--tag);border:1px solid var(--tag)}
.pill.ex{background:none;border:1px dashed var(--muted);color:var(--muted)}
/* agenda: faixa de camuflagem com o botão principal no centro (cores fixas, iguais nos dois temas) */
.hero{position:relative;border-radius:6px;overflow:hidden;min-height:350px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:10px;padding:26px 18px 120px;background:#3a4528 center bottom/cover no-repeat;color:#f4f6ec}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,17,10,.62) 0%,rgba(14,17,10,.35) 45%,rgba(14,17,10,0) 72%)}
/* black piano: preto brilhante com reflexo diagonal */
.hero.piano{min-height:0;padding-bottom:34px;border:1px solid #2c2c30;background:linear-gradient(165deg,#26262a 0%,#0c0c0e 38%,#020203 62%,#111114 100%)}
.hero.piano::before{background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 42%,rgba(255,255,255,.02) 50%,rgba(255,255,255,0) 58%),radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.08),rgba(255,255,255,0) 60%)}
.hero.piano::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.22)}
.hero .foto{position:absolute;bottom:10px;left:10px;font-family:var(--cond);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;background:rgba(14,17,10,.45);color:#e6eadb;border:1px solid rgba(230,234,219,.3);border-radius:3px;padding:4px 8px;cursor:pointer}
.hero>*{position:relative}
.hero h1{color:#f6f7ef;font-size:2.4rem;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.hero .eyebrow{font-family:var(--cond);font-weight:600;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:#d9dfc6}
.hero .lead{color:#e6eadb;margin:0;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero .cta{margin-top:10px;font-family:var(--cond);font-weight:700;font-size:1.25rem;letter-spacing:.1em;text-transform:uppercase;background:#c47a16;color:#fff8ec;border:0;border-radius:4px;padding:14px 30px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .15s,background .15s}
.hero .cta:hover{background:#d4861c}
.hero .cta:active{transform:translateY(1px)}
.hero .swap{position:absolute;bottom:10px;right:10px;font-family:var(--cond);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;background:rgba(14,17,10,.45);color:#e6eadb;border:1px solid rgba(230,234,219,.3);border-radius:3px;padding:4px 8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.trips{display:flex;flex-direction:column;gap:10px}
.trip{display:flex;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.trip.past{opacity:.75}
.date{flex:none;width:52px;text-align:center;border-right:1px solid var(--line);padding-right:12px;font-family:var(--cond)}
.date b{display:block;font-size:1.9rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.date span{font-weight:600;letter-spacing:.08em;color:var(--muted);font-size:.85rem}
.info{flex:1;min-width:0}
.info h3{margin:0;font-family:var(--cond);font-weight:700;font-size:1.25rem;line-height:1.15}
.info p{margin:2px 0 6px;color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-family:var(--cond);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.mini{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.mini i,.bar i{display:block;height:100%;background:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:4px;padding:18px;color:var(--muted);line-height:1.45}
details.old summary{cursor:pointer;font-family:var(--cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
/* ficha do jogo */
.back{background:none;border:0;padding:0;font-family:var(--cond);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.sub{color:var(--muted);margin-top:6px;font-family:var(--cond);font-weight:600;font-size:1.05rem;letter-spacing:.02em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:16px 0}
.tabs button{border:0;background:var(--card);padding:10px 4px;font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.progress{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--cond);font-weight:600}
.progress b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:2px;margin:8px 0 6px;overflow:hidden}
.status{font-family:var(--cond);font-weight:600;color:var(--accent);margin-bottom:12px}
.status.warn{color:var(--tag)}
.cats{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:4px}
.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.cat summary::-webkit-details-marker{display:none}
.cat h4{margin:0;font-family:var(--cond);font-weight:700;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;flex:1}
.cat .n{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.cat.full .n{color:var(--accent)}
.cat summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;transition:transform .2s}
.cat[open] summary::after{transform:rotate(-135deg)}
ul{list-style:none;margin:0;padding:0 6px 4px}
.item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid var(--line)}
.item input[type=checkbox]{appearance:none;width:24px;height:24px;flex:none;border:2px solid var(--muted);border-radius:3px;display:grid;place-content:center;margin:0;cursor:pointer;background:var(--bg)}
.item input:checked{background:var(--accent);border-color:var(--accent)}
.item input:checked::after{content:"";width:6px;height:12px;border-right:3px solid var(--accent-fg);border-bottom:3px solid var(--accent-fg);transform:rotate(45deg) translate(-1px,-1px)}
.item label,.item .lbl{flex:1;min-width:0;cursor:pointer;line-height:1.3;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted);font-size:.85rem}
.item input:checked + label{color:var(--done);text-decoration:line-through}
.tag{font-family:var(--cond);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tag);border:1px solid var(--tag);padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px;display:inline-block}
.del{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 8px}
.crit{font-family:var(--cond);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:none;color:var(--muted);padding:3px 6px;border-radius:2px}
.crit[aria-pressed="true"]{border-color:var(--tag);color:var(--tag)}
.add{display:flex;gap:8px;padding:10px 8px 10px;border-top:1px solid var(--line)}
input.txt,textarea,.add input{width:100%;min-width:0;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg)}
.add input{flex:1}
.add button{font-family:var(--cond);font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);border:0;border-radius:3px;padding:0 14px}
.hidedone .item.checked{display:none}
/* formulários */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.f label{display:block;font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.f .unit{position:relative}
.f .unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.f .unit input{padding-right:46px}
.f .unit.pre span{left:10px;right:auto}
.f .unit.pre input{padding-left:34px;padding-right:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px}
.sum{margin-top:14px;border:2px solid var(--accent);border-radius:4px;padding:14px;background:var(--card)}
.sum .line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-variant-numeric:tabular-nums}
.sum .line span:first-child{color:var(--muted)}
.sum .line+.line{border-top:1px solid var(--line)}
.sum .total{font-family:var(--cond);font-weight:700;font-size:1.5rem;color:var(--fg)}
.sum .total span:first-child{color:var(--fg)}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.note{color:var(--muted);font-size:.85rem;line-height:1.45;margin-top:10px}
.danger-zone{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.draft{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--tag);border-radius:4px;padding:10px 12px;margin-bottom:14px;background:var(--card)}
.draft b{display:block;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tag)}
.draft span{color:var(--muted);font-size:.9rem}
.draft>div{min-width:0;flex:1 1 200px}
.warnbox{border-style:solid}
/* barra inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:8px}
nav.bottom button{border:0;background:none;padding:8px;font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-radius:3px}
nav.bottom button[aria-current="true"]{color:var(--accent);background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:3px;font-family:var(--cond);font-weight:600;z-index:30}
/* menu lateral de viagens */
.hero .menu{position:absolute;top:10px;left:10px;font-family:var(--cond);font-weight:700;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;background:rgba(14,17,10,.5);color:#f4f6ec;border:1px solid rgba(230,234,219,.35);border-radius:3px;padding:6px 10px;display:flex;gap:6px;align-items:center}
.hero .menu i{display:block;width:14px;height:2px;background:currentColor;box-shadow:0 -4px 0 currentColor,0 4px 0 currentColor}
.hero{padding-top:52px}
.scrim{position:fixed;inset:0;background:rgba(10,12,8,.5);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(88vw,380px);background:var(--bg);border-right:1px solid var(--line);overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px)}
.drawer.open{transform:none}
.drawer .in{padding:16px}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer header h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem}
.drawer .x{background:none;border:1px solid var(--line);border-radius:3px;width:34px;height:34px;font-size:1.2rem;line-height:1}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.totals div{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px}
.totals span{display:block;font-family:var(--cond);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.totals b{font-family:var(--cond);font-size:1.3rem;font-variant-numeric:tabular-nums}
.totals .diff{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
.dsec{font-family:var(--cond);font-weight:700;font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px;display:flex;justify-content:space-between}
.vrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px}
.vrow .dt{font-family:var(--cond);font-weight:700;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.vrow .dt small{display:block;font-weight:600;font-size:.72rem;letter-spacing:.06em;color:var(--muted)}
.vrow .nm{min-width:0}
.vrow .nm b{display:block;font-family:var(--cond);font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .nm small{color:var(--muted);font-size:.82rem}
.vrow .vl{text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem;line-height:1.3}
.vrow .vl small{display:block;color:var(--muted);font-size:.75rem}
.over{color:var(--tag)}.under{color:var(--accent)}
.vrow .vl small.over{color:var(--tag)}.vrow .vl small.under{color:var(--accent)}
.dempty{color:var(--muted);font-size:.9rem;padding:8px 2px;border-top:1px solid var(--line)}
.tools{display:grid;gap:8px}
.tool{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;font-family:var(--cond);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tool small{font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);display:block;font-size:.82rem}
/* atalhos da tela principal */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px}
.qa b{font-family:var(--cond);font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase}
.qa small{color:var(--muted);font-size:.82rem;line-height:1.3}
/* ferramentas */
.result{margin-top:14px;border:2px solid var(--accent);border-radius:4px;padding:14px;background:var(--card)}
.result .big{font-family:var(--cond);font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.result.err{border-color:var(--tag)}
a.chip{text-decoration:none;color:inherit;display:inline-block}
.links{display:grid;gap:8px;margin-top:14px}
.links a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;font-family:var(--cond);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.links a small{font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);display:block;font-size:.82rem}
select.txt{appearance:auto}
@media (max-width:380px){.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="bottom"><div class="in">
  <button data-nav="agenda" id="nav-agenda">Operações</button>
  <button data-nav="template" id="nav-template">Lista padrão</button>
</div></nav>
<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Viagens" aria-hidden="true"></aside>

<script>
const PWA=true;
const TEMPLATE=[
 {id:"arma",name:"Réplica e energia",items:[["Réplica principal","Com ponteira laranja",1],["Réplica secundária / pistola"],["Magazines (mags)","Conte: principal + reserva",1],["Baterias LiPo carregadas","Confira a voltagem",1],["Carregador de bateria"],["Bag antichamas para LiPo"],["Gás green gas / CO2"],["BBs","Bio, no peso que o campo pede",1],["Speedloader"]]},
 {id:"prot",name:"Proteção",items:[["Óculos ou máscara vedada","Sem eles você não entra",1],["Proteção de boca / rosto"],["Luvas"],["Joelheiras"],["Cotoveleiras"],["Pano antiembaçante / spray"]]},
 {id:"eqp",name:"Equipamento",items:[["Colete / plate carrier"],["Cinto e coldre"],["Rádio + bateria extra"],["Headset / PTT"],["Braçadeira ou patch do time"],["Dump pouch"],["Lanterna"]]},
 {id:"roupa",name:"Roupas",items:[["Uniforme / camuflado"],["Bota"],["Meias extras"],["Gorro ou boné"],["Balaclava / shemagh"],["Roupa limpa para voltar"],["Chinelo"],["Saco para roupa suja"]]},

function calc(c){
  const km=numDec(c.km)*(c.ida?2:1), cons=numDec(c.consumo), litros=cons>0?km/cons:0;
  const comb=litros*numDec(c.preco), ped=numDec(c.pedagio), pes=Math.max(1,Math.round(numDec(c.pessoas))||1);
  const transp=comb+ped, porPessoa=transp/pes;
  const ind=["taxa","bbs","gas","comida","hosp","outros"].reduce((a,k)=>a+numDec(c[k]),0);
  return {km,litros,comb,ped,pes,transp,porPessoa,ind,total:porPessoa+ind};
}

function hsh(x,y,s){let h=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(s,982451653);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hsh(xi,yi,s),b=hsh(xi+1,yi,s),c=hsh(xi,yi+1,s),d=hsh(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return vn(x,y,s)*.6+vn(x*2.1,y*2.1,s+7)*.3+vn(x*4.3,y*4.3,s+13)*.1}
function camoURL(p,w,h,seed){
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;const c=cv.getContext("2d"),img=c.createImageData(w,h),D=img.data;
 const cols=p.cores.map(x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16))),k=w/600,sc=p.escala*k,q=p.pixel*k;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  let sx=x,sy=y;if(q){sx=Math.floor(x/q)*q;sy=Math.floor(y/q)*q}
  let ci=0;for(let l=1;l<4;l++){if(fbm(sx/sc*(1+l*.18),sy/sc*p.alongar*(1+l*.18),seed+l*31)>.56)ci=l}
  const o=(y*w+x)*4,col=cols[ci];D[o]=col[0];D[o+1]=col[1];D[o+2]=col[2];D[o+3]=255}
 c.putImageData(img,0,0);return cv.toDataURL("image/jpeg",.85);
}

 const f=fundos()[camoIdx]||CAMOS[0];

 if(f.piano){el.style.backgroundImage="";return}
 if(f.foto){el.style.backgroundImage=`url(${fotoURL})`;return}
 if(f.cena){if(!camoCache.cena)camoCache.cena="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(sceneSVG());el.style.backgroundImage=`url("${camoCache.cena}")`;return}
 const key=camoIdx+":"+w+"x"+h+":"+camoSeed;
 if(!camoCache[key])camoCache[key]=camoURL(f,w,h,camoSeed);
 el.style.backgroundImage=`url(${camoCache[key]})`;
}

  el.innerHTML=`<div class="line"><span>Combustível${c.litros?` · ${c.litros.toLocaleString("pt-BR",{maximumFractionDigits:1})} L para ${c.km.toLocaleString("pt-BR")} km`:""}</span><span>${brl(c.comb)}</span></div>

    d?`📅 ${SEM[d.getDay()]}, ${d.toLocaleDateString("pt-BR")}${t.time?" às "+t.time:""}`:"",

let toastT;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
function go(view,extra){Object.assign(S,{view},extra||{});save();render();window.scrollTo(0,0)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.nav){if(leavingDraft(()=>go(b.dataset.nav)))return;return go(b.dataset.nav)}
  if(b.dataset.open){closeDrawer();return go("trip",{tripId:b.dataset.open,tab:b.dataset.tab2||"check"})}
  if(b.dataset.tab){S.tab=b.dataset.tab;save();render();return}
  if(b.dataset.delitem){const t=trip();t.items=t.items.filter(i=>i.id!==b.dataset.delitem);save();b.closest("li").remove();updateProgress();return}
  if(b.dataset.tcrit){const [c,i]=b.dataset.tcrit.split("|");const it=S.template.find(x=>x.id===c).items.find(x=>x.id===i);it.crit=!it.crit;b.setAttribute("aria-pressed",it.crit);save();return}
  if(b.dataset.tdel){const [c,i]=b.dataset.tdel.split("|");const cat=S.template.find(x=>x.id===c);cat.items=cat.items.filter(x=>x.id!==i);save();renderTemplate();return}
  const a=b.dataset.act,show=(id,v)=>{const el=document.getElementById(id);if(el)el.hidden=!v};
  switch(a){
    case "back":if(leavingDraft(()=>go("agenda")))return;return go("agenda");
    case "saveOp":{const t=trip();if(!t)return;
      if(!String(t.name||"").trim()){S.tab="info";render();toast("Dê um nome à operação para salvar");document.getElementById("d-name")?.focus();return}
      if(!t.date){S.tab="info";render();toast("Escolha a data da operação para salvar");return}
      delete t.draft;save();toast("Operação salva");pendingLeave=null;return go("agenda")}
    case "discardOp":S.trips=S.trips.filter(x=>x.id!==S.tripId);S.tripId=null;save();toast("Rascunho descartado");{const n=pendingLeave;pendingLeave=null;return n?n():go("agenda")}
    case "stay":pendingLeave=null;return show("leaveConfirm",0);
    case "drawer":return openDrawer();
    case "closeDrawer":return closeDrawer();
    case "tool":{closeDrawer();const from=b.dataset.from==="trip"?S.tripId:null;return go(b.dataset.tool,{toolTrip:from,distRes:null,distDest:undefined,hotelCity:undefined,hotelIn:undefined,hotelN:undefined,hotelP:undefined})}
    case "toolBack":return S.toolTrip&&S.trips.find(t=>t.id===S.toolTrip)?go("trip",{tripId:S.toolTrip,tab:"cost"}):go("agenda");
    case "calcDist":return calcDist();
    case "applyKm":{const id=document.getElementById("t-apply").value,t=S.trips.find(x=>x.id===id);if(!t||!S.distRes)return;
      t.cost.km=String(Math.round(S.distRes.km));save();toast(`${Math.round(S.distRes.km)} km aplicados em ${t.name||"jogo sem nome"}`);return go("trip",{tripId:t.id,tab:"cost"})}
    case "camo":camoIdx=(camoIdx+1)%fundos().length;try{localStorage.setItem("mochila-fundo",camoIdx)}catch(err){}b.textContent=fundos()[camoIdx].nome+" ⟳";paintHero();return;
    case "new":{const t={id:uid(),draft:true,name:"",field:"",city:"",date:isoPlus(7),time:"",notes:"",items:itemsFromTemplate(S.template),cost:emptyCost()};S.trips.push(t);return go("trip",{tripId:t.id,tab:"info"})}
    case "hidedone":S.hideDone=!S.hideDone;b.setAttribute("aria-pressed",S.hideDone);document.getElementById("cats").classList.toggle("hidedone",S.hideDone);return;
    case "uncheck":return show("uncheckConfirm",1);
    case "uncheckNo":return show("uncheckConfirm",0);
    case "uncheckYes":trip().items.forEach(i=>i.done=false);save();renderTrip();updateProgress();return;
    case "delTrip":return show("delConfirm",1);
    case "delNo":return show("delConfirm",0);
    case "delYes":S.trips=S.trips.filter(t=>t.id!==S.tripId);S.tripId=null;toast("Jogo apagado");return go("agenda");
    case "dup":{const o=trip(),t=JSON.parse(JSON.stringify(o));t.id=uid();t.draft=true;t.example=false;t.name=(o.name||"Jogo")+" (cópia)";t.date=isoPlus(7);t.items.forEach(i=>{i.done=false;i.id=uid()+i.cat});S.trips.push(t);toast("Jogo duplicado");return go("trip",{tripId:t.id,tab:"info"})}
    case "copy":{const txt=resumo(trip());const done=()=>toast("Resumo copiado");
      try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt))}catch(err){fallbackCopy(txt)}return}
    case "resetTpl":return show("tplConfirm",1);
    case "tplNo":return show("tplConfirm",0);
    case "tplYes":S.template=defaultTemplate();save();renderTemplate();toast("Lista restaurada");return;
    case "copyData":{const txt=backupText();try{navigator.clipboard.writeText(txt).then(()=>toast("Dados copiados"),()=>showData(txt))}catch(err){showData(txt)}return}
    case "export":return exportBackup();
    case "importPaste":return askImport(document.getElementById("importText").value);
    case "importNo":pendingImport=null;return show("importConfirm",0);
    case "importYes":if(pendingImport){S=Object.assign({view:"agenda",tripId:null,tab:"check",open:{}},pendingImport);S.hideDone=false;pendingImport=null;save();toast("Backup importado");go("agenda")}return;
    case "install":if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}return;
  }
});
function backupText(){const {view,tripId,tab,hideDone,...data}=S;return JSON.stringify({app:"mochila-de-jogo",versao:2,salvoEm:new Date().toISOString(),...data})}
function showData(txt){const ta=document.createElement("textarea");ta.value=txt;ta.rows=4;ta.readOnly=true;ta.style.marginTop="10px";document.querySelector("[data-act=copyData]").closest(".box").append(ta);ta.focus();ta.select();toast("Selecione e copie o texto")}
let pendingImport=null;
function askImport(txt){
  let d;try{d=JSON.parse(String(txt).trim())}catch(e){return toast("Não reconheci esses dados. Cole o texto completo do backup.")}
  if(!d||!Array.isArray(d.trips)||!Array.isArray(d.template))return toast("Esse texto não é um backup do Mochila de Jogo.");
  pendingImport={template:d.template,trips:d.trips,open:d.open||{}};
  document.getElementById("importInfo").textContent=`Backup com ${d.trips.length} ${d.trips.length===1?"jogo":"jogos"}. Substituir os dados atuais?`;
  const el=document.getElementById("importConfirm");el.hidden=false;el.scrollIntoView({block:"center"});
}
async function exportBackup(){
  const name="mochila-de-jogo-backup-"+isoPlus(0)+".json";
  const file=new File([backupText()],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Backup Mochila de Jogo"});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Backup salvo em Downloads");
}
document.addEventListener("change",e=>{if(e.target.id==="importFile"&&e.target.files[0]){e.target.files[0].text().then(askImport);e.target.value=""}});
let installEvt=null;
let pendingLeave=null;

  const t=S.view==="trip"&&trip();if(!t||!t.draft)return false;
  pendingLeave=next;const el=document.getElementById("leaveConfirm");if(el){el.hidden=false;el.scrollIntoView({block:"center",behavior:"smooth"})}

}

let drawerOpen=false;
const drawer=document.getElementById("drawer"),scrim=document.getElementById("scrim");
function openDrawer(){drawerOpen=true;renderDrawer();scrim.hidden=false;drawer.setAttribute("aria-hidden","false");requestAnimationFrame(()=>drawer.classList.add("open"));setTimeout(()=>drawer.querySelector(".x")?.focus(),50)}

const hasReal=t=>String(t.cost?.real??"").trim()!=="";
function vrow(t,past){
  const d=parseD(t.date),prev=calc(t.cost).total,real=numDec(t.cost.real),df=real-prev;
  const dt=d?`${String(d.getDate()).padStart(2,"0")}<small>${MES[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+String(d.getFullYear()).slice(2):""}</small>`:`--<small>DATA</small>`;
  let vl;
  if(!past)vl=`${prev?brl(prev):"—"}<small>previsto</small>`;
  else if(hasReal(t))vl=`${brl(real)}<small class="${df>0.005?"over":"under"}">${Math.abs(df)<0.005?"igual ao previsto":(df>0?"+":"−")+brl(Math.abs(df))}</small>`;
  else vl=`${prev?brl(prev):"—"}<small class="over">anotar gasto</small>`;
  return `<button class="vrow" data-open="${t.id}" data-tab2="${past?"cost":"check"}"><span class="dt">${dt}</span><span class="nm"><b>${esc(t.name)||"Sem nome"}</b><small>${esc(t.city||t.field||"")}${past?` · previsto ${brl(prev)}`:""}</small></span><span class="vl">${vl}</span></button>`;
}
function renderDrawer(){
  const y=new Date().getFullYear();
  const sorted=saved().sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));
  const next=sorted.filter(t=>{const d=daysTo(t.date);return d===null||d>=0});
  const past=sorted.filter(t=>{const d=daysTo(t.date);return d!==null&&d<0}).reverse();
  const ano=t=>parseD(t.date)?.getFullYear()===y;
  const prevAno=saved().filter(ano).reduce((a,t)=>a+calc(t.cost).total,0);
  const feitas=past.filter(t=>ano(t)&&hasReal(t));
  const realAno=feitas.reduce((a,t)=>a+numDec(t.cost.real),0),prevFeitas=feitas.reduce((a,t)=>a+calc(t.cost).total,0),df=realAno-prevFeitas;
  const aRealizar=next.reduce((a,t)=>a+calc(t.cost).total,0);
  drawer.innerHTML=`<div class="in">
   <header><h2>Viagens</h2><button class="x" data-act="closeDrawer" aria-label="Fechar">×</button></header>
   <div class="totals">
    <div><span>Previsto ${y}</span><b>${brl(prevAno)}</b></div>
    <div><span>Realizado ${y}</span><b>${brl(realAno)}</b></div>
    ${feitas.length?`<div class="diff"><span>Nos ${feitas.length} ${feitas.length>1?"jogos anotados":"jogo anotado"}</span><b class="${df>0.005?"over":"under"}">${Math.abs(df)<0.005?"igual ao previsto":(df>0?"+":"−")+brl(Math.abs(df))}</b></div>`:""}
   </div>
   <div class="dsec"><span>A realizar (${next.length})</span><span>${aRealizar?brl(aRealizar):""}</span></div>
   ${next.length?next.map(t=>vrow(t,false)).join(""):`<div class="dempty">Nenhuma viagem marcada.</div>`}
   <div class="dsec"><span>Realizadas (${past.length})</span></div>
   ${past.length?past.map(t=>vrow(t,true)).join(""):`<div class="dempty">As viagens aparecem aqui depois da data do jogo.</div>`}
   <div class="dsec"><span>Ferramentas</span></div>
   <div class="tools">
    <button class="tool" data-act="tool" data-tool="dist"><span>Calcular distância<small>Km e tempo de carro entre cidades</small></span>›</button>
    <button class="tool" data-act="tool" data-tool="hotel"><span>Buscar hotéis<small>Booking, Google e mapa</small></span>›</button>
   </div></div>`;
}

/* ===== ferramenta: distância entre cidades ===== */
const toolTrip=()=>S.trips.find(t=>t.id===S.toolTrip);
const mapsDir=(o,d)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}&travelmode=driving`;
function upcomingOptions(sel){const ts=saved().filter(t=>{const d=daysTo(t.date);return d===null||d>=0}).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));
  return ts.map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(t.name)||"Sem nome"}${t.date?" · "+parseD(t.date).toLocaleDateString("pt-BR"):""}</option>`).join("")}
function renderDist(){
  const t=toolTrip(),dest=S.distDest??(t?[t.field,t.city].filter(Boolean).join(", "):"");
  app.innerHTML=`<button class="back" data-act="toolBack">← ${t?esc(t.name)||"Jogo":"Jogos"}</button>
   <h1>Calcular distância</h1>
   <p class="lead">Distância e tempo de carro entre a sua cidade e o campo.</p>
   <div class="box" style="margin-top:16px"><div class="form">
    <div class="f full"><label for="t-orig">Saindo de</label><input class="txt" id="t-orig" data-tool-in="home" value="${esc(S.home||"")}" placeholder="Ex.: Campinas, SP" autocomplete="address-level2"></div>
    <div class="f full"><label for="t-dest">Indo para</label><input class="txt" id="t-dest" data-tool-in="distDest" value="${esc(dest)}" placeholder="Cidade ou endereço do campo"></div>
   </div><div class="row" style="margin-top:12px"><button class="chip primary" data-act="calcDist">Calcular</button><a class="chip" id="mapsLink" target="_blank" rel="noopener" href="${mapsDir(S.home||"",dest)}">Ver rota no Google Maps</a></div></div>
   <div id="distOut">${distResultHTML()}</div>`;
}
function distResultHTML(){
  const r=S.distRes;if(!r)return "";
  if(r.err)return `<div class="result err">${esc(r.err)}</div>`;
  const h=Math.floor(r.min/60),m=Math.round(r.min%60),t=toolTrip();
  const opts=upcomingOptions(t?.id);
  return `<div class="result"><div class="big">${Math.round(r.km).toLocaleString("pt-BR")} km</div>
   <div>${h?h+" h ":""}${m} min de carro, só ida · ${Math.round(r.km*2).toLocaleString("pt-BR")} km ida e volta</div>
   <p class="note">De ${esc(r.de)}<br>até ${esc(r.ate)}</p>
   ${opts?`<div class="f" style="margin-top:12px"><label for="t-apply">Usar esta distância no jogo</label><select class="txt" id="t-apply">${opts}</select></div>
   <div class="row" style="margin-top:10px"><button class="chip primary" data-act="applyKm">Aplicar distância</button></div>`:`<p class="note">Crie uma Nova Operação para usar esta distância no cálculo de custos.</p>`}</div>`;
}
async function geocode(q){
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&q=${encodeURIComponent(q)}`);
  if(!r.ok)throw new Error("geo");const j=await r.json();if(!j.length)return null;
  return {lat:+j[0].lat,lon:+j[0].lon,nome:j[0].display_name.split(",").slice(0,3).join(",")};
}
async function calcDist(){
  const o=document.getElementById("t-orig").value.trim(),d=document.getElementById("t-dest").value.trim(),out=document.getElementById("distOut");
  if(!o||!d){S.distRes={err:"Preencha as duas cidades."};out.innerHTML=distResultHTML();return}
  if(!navigator.onLine){S.distRes={err:"Sem internet agora. O cálculo precisa de conexão. Tente de novo quando tiver sinal."};out.innerHTML=distResultHTML();return}
  out.innerHTML=`<div class="result">Calculando…</div>`;
  try{
    const a=await geocode(o);if(!a)throw {msg:`Não encontrei "${o}". Tente escrever cidade e estado, como "Campinas, SP".`};
    const b=await geocode(d);if(!b)throw {msg:`Não encontrei "${d}". Tente escrever cidade e estado, ou o endereço do campo.`};
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
    const j=await r.json();if(!j.routes?.length)throw {msg:"Não achei uma rota de carro entre esses lugares."};
    S.distRes={km:j.routes[0].distance/1000,min:j.routes[0].duration/60,de:a.nome,ate:b.nome};
  }catch(e){
    S.distRes={err:e.msg||(PWA?"Não consegui calcular agora. Confira a internet ou use o botão do Google Maps.":"O cálculo automático funciona no app instalado. Aqui na prévia, use o botão Ver rota no Google Maps.")};
  }
  out.innerHTML=distResultHTML();
}

/* ===== ferramenta: buscar hotéis ===== */
function isoAdd(s,n){const d=parseD(s)||new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function renderHotel(){
  const t=toolTrip();
  const city=S.hotelCity??(t?.city||""),ci=S.hotelIn??(t?.date?isoAdd(t.date,-1):isoPlus(7)),nights=S.hotelN??"1",ppl=S.hotelP??(t?String(Math.max(1,Math.round(numDec(t.cost.pessoas))||1)):"1");
  app.innerHTML=`<button class="back" data-act="toolBack">← ${t?esc(t.name)||"Jogo":"Jogos"}</button>
   <h1>Buscar hotéis</h1>
   <p class="lead">${t?"Já preenchi com a cidade e a data do jogo. ":""}Os resultados abrem no site escolhido.</p>
   <div class="box" style="margin-top:16px"><div class="form">
    <div class="f full"><label for="h-city">Cidade ou campo</label><input class="txt" id="h-city" data-tool-in="hotelCity" value="${esc(city)}" placeholder="Ex.: Atibaia, SP"></div>
    <div class="f"><label for="h-in">Check-in</label><input class="txt" type="date" id="h-in" data-tool-in="hotelIn" value="${esc(ci)}"></div>
    <div class="f"><label for="h-n">Noites</label><input class="txt" id="h-n" data-tool-in="hotelN" inputmode="numeric" value="${esc(nights)}"></div>
    <div class="f"><label for="h-p">Pessoas</label><input class="txt" id="h-p" data-tool-in="hotelP" inputmode="numeric" value="${esc(ppl)}"></div>
   </div>${t?`<p class="note">Check-in na véspera do jogo (${parseD(t.date).toLocaleDateString("pt-BR")}), para chegar descansado.</p>`:""}</div>
   <div class="links" id="hotelLinks"></div>
   <p class="note">Achou um hotel? Anote o valor em Custos → Hospedagem do jogo.</p>`;
  updateHotelLinks();
}
function updateHotelLinks(){
  const el=document.getElementById("hotelLinks");if(!el)return;
  const city=(S.hotelCity??document.getElementById("h-city").value).trim(),ci=document.getElementById("h-in").value,n=Math.max(1,Math.round(numDec(document.getElementById("h-n").value))||1),p=Math.max(1,Math.round(numDec(document.getElementById("h-p").value))||1);
  if(!city){el.innerHTML=`<div class="dempty">Digite a cidade para ver as opções.</div>`;return}
  const co=isoAdd(ci,n),q=encodeURIComponent(city);
  const booking=`https://www.booking.com/searchresults.pt-br.html?ss=${q}&checkin=${ci}&checkout=${co}&group_adults=${p}&no_rooms=1&group_children=0`;
  const google=`https://www.google.com/travel/search?q=${encodeURIComponent("hotéis em "+city)}&hl=pt-BR`;
  const mapa=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("hotéis perto de "+city)}`;
  const airbnb=`https://www.airbnb.com.br/s/${q}/homes?checkin=${ci}&checkout=${co}&adults=${p}`;
  el.innerHTML=[["Booking",booking,`${n} ${n>1?"noites":"noite"} · ${p} ${p>1?"pessoas":"pessoa"}`],["Google Hotéis",google,"Compara preços de vários sites"],["Airbnb",airbnb,"Casas para o time dividir"],["Ver no mapa",mapa,"Hotéis perto do local"]]
    .map(([n1,u,sub])=>`<a href="${u}" target="_blank" rel="noopener"><span>${n1}<small>${sub}</small></span>↗</a>`).join("");
}
document.addEventListener("input",e=>{
  const k=e.target.dataset?.toolIn;if(!k)return;
  S[k]=e.target.value;if(k==="home"||k==="distDest"){const l=document.getElementById("mapsLink");if(l)l.href=mapsDir(document.getElementById("t-orig").value,document.getElementById("t-dest").value)}
  if(k.startsWith("hotel"))updateHotelLinks();save();
});
document.addEventListener("change",e=>{
  if(e.target.id!=="heroFoto"||!e.target.files[0])return;
  const file=e.target.files[0];e.target.value="";
  const img=new Image();img.onload=()=>{
    const k=Math.min(1,1400/img.width),cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);
    fotoURL=cv.toDataURL("image/jpeg",.8);camoIdx=fundos().length-1;
    try{localStorage.setItem("mochila-foto",fotoURL);localStorage.setItem("mochila-fundo",camoIdx);toast("Foto salva como fundo")}catch(err){toast("Foto aplicada, mas é grande demais para salvar. Tente uma menor.")}
    if(S.view==="agenda")render();
  };
  img.onerror=()=>toast("Não consegui abrir essa imagem. Tente outra foto.");
  img.src=URL.createObjectURL(file);
});
function fallbackCopy(txt){
  const box=document.getElementById("sum");const ta=document.createElement("textarea");ta.value=txt;ta.rows=6;ta.style.marginTop="12px";ta.readOnly=true;
  box.after(ta);ta.focus();ta.select();toast("Selecione e copie o texto abaixo");
}
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.check){const it=trip().items.find(i=>i.id===el.dataset.check);it.done=el.checked;el.closest("li").classList.toggle("checked",el.checked);save();updateProgress();return}
  if(el.dataset.cost==="ida"){trip().cost.ida=el.checked;save();updateCost()}
});
document.addEventListener("input",e=>{
  const el=e.target,t=trip();
  if(el.dataset.cost&&el.dataset.cost!=="ida"){t.cost[el.dataset.cost]=el.value;save();updateCost();return}
  if(el.dataset.info){t[el.dataset.info]=el.value;if(t.example)t.example=false;save();
    if(el.dataset.info==="name")document.getElementById("tripTitle").textContent=el.value||"Sem nome";}
});
document.addEventListener("focusout",e=>{if(e.target.dataset?.info==="date"||e.target.dataset?.info==="time")renderTrip()});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;
  if(f.dataset.additem){trip().items.push({id:uid(),cat:f.dataset.additem,label:v,note:"",crit:false,done:false});save();renderTrip();updateProgress();document.getElementById("add-"+f.dataset.additem)?.focus()}
  if(f.dataset.tadd){S.template.find(c=>c.id===f.dataset.tadd).items.push({id:uid(),label:v,note:"",crit:false});save();renderTemplate();document.getElementById("tadd-"+f.dataset.tadd)?.focus()}
});
document.addEventListener("toggle",e=>{
  const d=e.target;if(d.dataset?.cat){S.open[d.dataset.cat]=d.open;save()}if(d.dataset?.tcat){S.open["t-"+d.dataset.tcat]=d.open;save()}
},true);
const _rt=renderTrip;renderTrip=function(){_rt();if(S.tab==="check")updateProgress()};
function installHint(){
  if(!PWA)return "";
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(standalone)return "";
  if(installEvt)return `<div class="box row" style="margin-top:14px;justify-content:space-between"><span>Instale o app para abrir sem internet.</span><button class="chip primary" data-act="install">Instalar app</button></div>`;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))return `<div class="box" style="margin-top:14px">Para instalar no iPhone: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</div>`;
  return "";
}
if(PWA){
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(S.view==="agenda")render()});
  addEventListener("appinstalled",()=>{installEvt=null;toast("App instalado");render()});
  if("serviceWorker" in navigator){
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController)toast("App atualizado para a versão mais nova")});
  }
  try{navigator.storage?.persist?.()}catch(e){}
}
render();
</script>
</body>
